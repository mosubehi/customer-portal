apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-portal
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: customer-portal
    spec:
      containers:
        - name: customer-portal
          image: customer-portal:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
